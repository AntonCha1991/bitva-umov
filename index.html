<!doctype html><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#10182b"/><title>Битва умов</title><style>

:root{color-scheme:dark;--bg:#111822;--panel:#1b2633;--panel-soft:#202e3d;--line:#344353;--text:#eef3f6;--muted:#aab9c5;--accent:#80c8bb;--accent-deep:#19352f;--green:#88d6a3;--yellow:#edc58f;--red:#ff8795}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 82% -10%,#263e46 0%,transparent 48%),linear-gradient(180deg,#141e29,#101720 60%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100dvh}
body.menu-open{overflow:hidden}
.wrap{max-width:850px;margin:auto;padding:23px 19px 70px}
header{display:flex;align-items:center;gap:12px;margin-bottom:28px;padding:0 0 16px;border-bottom:1px solid #31404d}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
h1{font-size:clamp(30px,6.3vw,44px);line-height:1.13;letter-spacing:-.03em;margin:10px 0 15px}
h2{font-size:23px;letter-spacing:-.02em;margin:0 0 12px}
h3{margin:0 0 12px;font-size:18px}
p{line-height:1.6}
.pill{border:1px solid #43596a;border-radius:100px;padding:6px 11px;color:#b9cdd6;font-size:10px;font-weight:750;letter-spacing:.06em;white-space:nowrap}
.brand{color:var(--text);text-decoration:none;font-size:15px;font-weight:900;letter-spacing:.035em;white-space:nowrap}
.brand:hover{color:var(--accent)}
.brand:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hint,.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;margin:14px 0;box-shadow:0 10px 35px #00000015}
.hero{padding:30px;background:linear-gradient(135deg,#263d43,#202b38 72%);border-color:#42585a}
.hero .badge{color:#9bd9cf}
button,input{font:inherit}
button{cursor:pointer;border:1px solid transparent;border-radius:12px;padding:13px 17px;font-weight:760;min-height:48px;transition:background .16s ease,transform .13s ease,border-color .16s ease}
button:active{transform:scale(.985)}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--accent);color:#102922;width:100%;box-shadow:0 3px 0 #345e57}
.primary:hover{background:#a2ddd2}
.secondary{background:#283a48;color:var(--text);border-color:#496070}
.secondary:hover{background:#344957}
.small{padding:9px 12px;min-height:38px}
.wide{width:100%;margin-top:10px}
.flex{display:flex;gap:10px;flex-wrap:wrap}.flex>*{flex:1}
input{width:100%;background:#131e29;border:1px solid #506170;color:#fff;border-radius:12px;padding:13px 14px;min-height:49px;margin-top:6px}
input:focus{border-color:var(--accent)}
input::placeholder{color:#8597a5}
.names{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.names label{font-size:13px;color:#cad5db;font-weight:600}
.names label:last-child:nth-child(odd){grid-column:1/-1}
.add-player{width:100%;margin-top:15px;border-style:dashed}
.scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:9px;margin:16px 0}
.score{border:1px solid #455464;background:#202e3b;border-radius:15px;padding:13px;text-align:center;overflow-wrap:anywhere}
.score span{font-size:13px}.score b{display:block;font-size:27px;margin:4px 0;color:#e5f3ef}.score small{color:var(--muted)}
.score.leader{border-color:var(--accent);background:#203c3a}
.progress{height:8px;background:#34414f;border-radius:20px;overflow:hidden;margin:10px 0 18px}
.progress>div{height:100%;background:var(--accent);transition:width .25s}
.timer{font-size:42px;font-weight:850;font-variant-numeric:tabular-nums}
.timer.good{color:var(--green)}.timer.warn{color:var(--yellow)}.timer.bad{color:var(--red)}
.question{font-size:clamp(22px,5vw,31px);font-weight:780;line-height:1.3;margin:18px 0 24px;letter-spacing:-.025em}
.options{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.option{background:#263646;border:1px solid #4a6170;color:var(--text);text-align:left;min-height:77px;font-weight:650}
.option:hover:not(:disabled){background:#31495a;border-color:#90caba}
.option.selected{outline:3px solid var(--accent)}
.option.right{background:#1e5648;border-color:#79d6ab}
.option.wrong{background:#62323f;border-color:#ef9aaa}
.option:disabled{opacity:1;cursor:default}
.risk{color:var(--yellow)}
.rule{border-bottom:1px solid #394a59;padding:12px 0;overflow-wrap:anywhere}
.stats{margin:13px 0}.bar{background:#354655;border-radius:100px;overflow:hidden;height:10px;margin:5px 0 10px}.bar>div{background:var(--accent);height:100%}
.media{max-width:100%;max-height:260px;border-radius:16px;object-fit:cover;display:none;margin:15px auto}
.badge{display:inline-block;color:#92d2c6;font-weight:800;font-size:12px;letter-spacing:.085em}
.center{text-align:center}.spaced{margin-top:18px}
.footer{margin-top:33px;color:#90a2b0;text-align:center;font-size:12px}
.round-strip{display:flex;gap:5px;margin:13px 0}
.round-strip>span{flex:1;height:6px;background:#344656;border-radius:5px}
.round-strip>span.past{background:#648f87}.round-strip>span.active{background:var(--accent)}
.menu-toggle{width:44px;height:44px;min-height:44px;display:grid;place-items:center;padding:0;background:#263542;color:var(--text);border:1px solid #425363;font-size:23px;line-height:1}
.menu-toggle:hover{background:#354b56}
.overlay{position:fixed;inset:0;background:#0009;z-index:20;opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s}
.sidebar{position:fixed;top:0;bottom:0;left:0;width:min(330px,88vw);background:#192631;border-right:1px solid #47606a;z-index:21;padding:27px 20px;transform:translateX(-102%);transition:transform .2s ease;box-shadow:12px 0 45px #0004}
.menu-open .overlay{opacity:1;visibility:visible}
.menu-open .sidebar{transform:translateX(0)}
.sidebar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
.sidebar-brand{font-weight:850;letter-spacing:.05em}
.close-menu{width:40px;min-height:40px;padding:0;background:#30414f;color:white;border:1px solid #4b6370}
.menu-label{color:#96aab6;font-size:11px;letter-spacing:.11em;font-weight:850;text-transform:uppercase;margin:18px 8px 12px}
.nav-link{display:flex;align-items:center;gap:12px;width:100%;background:transparent;color:#e5f0f2;text-align:left;padding:14px 13px;margin:5px 0;border-radius:12px;font-weight:650}
.nav-link:hover,.nav-link.active{background:#2a4346;color:#a7e5d9}
.nav-link:disabled{opacity:.42}
.nav-icon{width:24px;display:inline-flex;justify-content:center;font-size:18px}
.menu-note{font-size:12px;color:#a7b9bf;background:#253743;padding:14px;border-radius:12px;line-height:1.6;margin-top:24px}
.info-list{padding-left:22px;color:#d6e2e6}.info-list li{margin-bottom:10px}
@media(max-width:600px){.wrap{padding:17px 13px 45px}header{gap:9px;margin-bottom:21px}.brand{font-size:13px}.pill{font-size:9px;max-width:116px;overflow:hidden;text-overflow:ellipsis}.header-actions{gap:8px}.card{padding:18px;border-radius:17px}.hero{padding:24px 20px}.names,.options{grid-template-columns:1fr}.question{margin:14px 0 19px}.scoreboard{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}.menu-toggle{width:42px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}

/* App home */
.landing{min-height:calc(100dvh - 190px);display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;padding:12px 5px 45px}
.landing-visual{width:min(100%,470px);aspect-ratio:460/330;display:flex;justify-content:center;align-items:center;margin:0 auto 3px}
.brain-art{display:block;width:100%;height:100%;filter:drop-shadow(0 0 22px #6583e744)}
.landing h1{font-size:clamp(39px,9vw,59px);font-weight:870;letter-spacing:-.048em;margin:7px 0 8px}
.landing-accent{height:4px;width:98px;border-radius:10px;background:linear-gradient(90deg,#67d7e0,#a188e3);margin:10px 0 17px}
.landing-subtitle{font-size:13px;letter-spacing:.17em;text-transform:uppercase;color:#b3c1d3;margin:0 0 39px}
.landing-tile{display:flex;align-items:center;gap:18px;text-align:left;width:min(100%,510px);padding:19px 22px;background:linear-gradient(110deg,#1d414e,#2c2849);color:#fff;border:1px solid #6685b6;border-radius:18px;box-shadow:0 10px 40px #090f1d55}
.landing-tile:hover{border-color:#9bdaef;background:linear-gradient(110deg,#235365,#413462)}
.tile-icon{font-size:33px;color:#8dd7e9;display:grid;place-items:center;width:47px}.tile-text{display:flex;flex-direction:column;flex:1;gap:2px}.tile-text b{font-size:20px}.tile-text small{font-size:13px;color:#b7cbd7}.tile-arrow{font-size:32px;color:#bbd8e6}
.quiz-intro{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rules-button{background:transparent;border:1px solid #506678;color:#a8d9d6;font-size:13px;font-weight:700;min-height:39px;padding:8px 12px}
.rules-button:hover{background:#293b48}
@media(max-width:600px){.landing{min-height:calc(100dvh - 170px);justify-content:flex-start;padding-top:20px}.landing-visual{margin-top:10px}.landing-subtitle{font-size:11px;letter-spacing:.12em;margin-bottom:32px}.landing-tile{padding:17px 16px}}

/* On the app landing screen, show only the brain, title, subtitle and navigation menu. */
body.landing-page header{justify-content:flex-end;border-bottom:0;margin-bottom:0;padding-bottom:0}
body.landing-page header .brand,
body.landing-page header .pill,
body.landing-page .landing-tile,
body.landing-page .footer{display:none}
body.landing-page .header-actions{margin-left:auto}
body.landing-page .landing{min-height:calc(100dvh - 115px);padding-bottom:30px}

<div class="wrap"><header><a class="brand" href="./" id="home-link" aria-label="Битва умов — на главную">🧠 БИТВА УМОВ</a><div class="header-actions"><span class="pill" id="stage">ВИКТОРИНА</span><button class="menu-toggle" id="open-menu" aria-label="Открыть меню" aria-expanded="false" aria-controls="side-menu">☰</button></div></header><main id="app"></main><div class="footer" id="footer">Битва умов</div></div><script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);const app=$('#app');const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const questions=[

let players=[''],scores=[],round=0,order=[],answers=[],risks=[],turn=0,seconds=30,timer=null,screen='landing',lastFirst=-1,locked=false;
const stop=()=>{if(timer){clearInterval(timer);timer=null}};

function scoreHtml(){const max=Math.max(...scores,0);return `<div class="scoreboard">${players.map((p,i)=>`<div class="score ${scores[i]===max&&max>0?'leader':''}"><span>${escapeHtml(p)}</span><b>${scores[i]}</b><small>очков</small></div>`).join('')}</div>`}
function strip(){return `<div class="round-strip">${Array.from({length:10},(_,i)=>`<span class="${i<round?'past':i===round?'active':''}"></span>`).join('')}</div>`}
function home(){stop();document.body.classList.add('landing-page');screen='landing';setStage('ГЛАВНАЯ');$('#footer').textContent='Битва умов';app.innerHTML=`<section class="landing"><div class="landing-visual"><svg class="brain-art" viewBox="0 0 460 330" role="img" aria-label="Стилизованный светящийся нейромозг" xmlns="http://www.w3.org/2000/svg">

<g filter="url(#softGlow)" fill="#a6f6ff" opacity=".7"><circle cx="117" cy="148" r="9"/><circle cx="215" cy="178" r="11"/><circle cx="284" cy="163" r="10"/></g></svg></div><h1>Битва умов</h1><div class="landing-accent"></div><p class="landing-subtitle">Интеллектуальные игры и задания</p><button class="landing-tile" data-action="open-quiz"><span class="tile-icon">✦</span><span class="tile-text"><b>Викторина</b><small>Проверь свои знания</small></span><span class="tile-arrow">›</span></button></section>`;highlightMenu('home')}

function init(){const inputs=[...document.querySelectorAll('[data-name]')];const entered=inputs.map(e=>e.value.trim());const missing=entered.findIndex(v=>!v);if(missing!==-1){inputs[missing].focus();inputs[missing].setAttribute('aria-invalid','true');alert('Введите имя игрока '+(missing+1));return}players=entered;scores=players.map(()=>0);round=0;lastFirst=-1;startRound()}

function current(){return order[turn]}
function currentRound(){return questions[round]}
function ready(){stop();screen='ready';locked=false;let p=current(),risky=(round+1)%2===0;setStage(`РАУНД ${round+1} / 10`);app.innerHTML=strip()+`<div class="card"><span class="badge">${risky?'⚡ РАУНД «РИСК»':'ОБЫЧНЫЙ РАУНД'}</span><h1>Ход: ${escapeHtml(players[p])}</h1><p class="hint">Передайте телефон игроку. Вопрос появится после нажатия «Я готов».</p>${risky?`<div class="card"><h3 class="risk">Выбор риска</h3><p>Текущий счёт: <b>${scores[p]}</b>. В случае правильного ответа с риском: <b>${scores[p]*2+10}</b>, в случае ошибки: <b>0</b>.</p><div class="flex"><button class="secondary" data-action="no-risk">Без риска</button><button class="secondary" data-action="take-risk">⚡ РИСК</button></div><p id="risk-choice" class="hint">Пока без риска</p></div>`:''}${button('Я готов — показать вопрос','answer-ready')}</div>${scoreHtml()}`}
function showQuestion(){screen='question';locked=false;seconds=30;const [topic,q,opts]=currentRound();app.innerHTML=strip()+`<div class="card"><span class="badge">Раунд ${round+1} · ${escapeHtml(topic)}${risks[current()]?' · ⚡ РИСК':''}</span><div class="flex" style="align-items:center;justify-content:space-between"><span class="muted">Отвечает: <b>${escapeHtml(players[current()])}</b></span><span id="timer" class="timer good">30</span></div><div class="progress"><div id="timebar" style="width:100%"></div></div><div class="question">${escapeHtml(q)}</div><div class="options">${opts.map((x,i)=>`<button class="option" data-action="answer" data-choice="${i}">${'АБВГ'[i]}. ${escapeHtml(x)}</button>`).join('')}</div><p class="hint">Ответ нельзя изменить. Результат покажем только после всех игроков.</p></div>`;stop();timer=setInterval(()=>{seconds--;const t=$('#timer');if(t){t.textContent=seconds;t.className='timer '+(seconds>=16?'good':seconds>=11?'warn':'bad');$('#timebar').style.width=`${seconds/30*100}%`;}if(seconds<=0)submit(-1)},1000)}
function submit(choice){if(locked)return;locked=true;stop();answers[current()]=choice;turn++;if(turn<players.length){ready()}else roundResult()}
function roundResult(){screen='result';stop();setStage(`ИТОГИ ${round+1} / 10`);const [topic,q,opts,right,explain,search]=currentRound();for(let i=0;i<players.length;i++){if(answers[i]===right){scores[i]=risks[i]?scores[i]*2+10:scores[i]+10}else if(risks[i])scores[i]=0}let cnt=opts.map((_,i)=>answers.filter(v=>v===i).length);const imageSearch=encodeURIComponent(search);app.innerHTML=strip()+`<div class="card"><div class="badge">${escapeHtml(topic)} · Раунд ${round+1}</div><h2>Ответы раскрыты!</h2><div class="question">${escapeHtml(q)}</div><div class="options">${opts.map((x,i)=>`<button class="option ${i===right?'right':cnt[i]?'wrong':''}" disabled>${'АБВГ'[i]}. ${escapeHtml(x)} ${i===right?'✓':''}</button>`).join('')}</div><div class="card"><h3>Почему так?</h3><p>${escapeHtml(explain)}</p><img id="topic-photo" class="media" alt="Иллюстрация к вопросу"/><p id="img-info" class="muted" style="font-size:12px">Иллюстрация загружается, если она доступна в Википедии.</p></div><h3>Как голосовали</h3>${opts.map((x,i)=>`<div class="stats"><div>${'АБВГ'[i]} · ${escapeHtml(x)} — ${cnt[i]} из ${players.length}</div><div class="bar"><div style="width:${cnt[i]/players.length*100}%"></div></div></div>`).join('')}<h3>Ответы игроков</h3>${players.map((p,i)=>`<div class="rule">${escapeHtml(p)}: <b>${answers[i]<0?'Время вышло':opts[answers[i]]}</b> ${answers[i]===right?'✅':'❌'} ${risks[i]?'⚡ РИСК':''}</div>`).join('')}</div>${scoreHtml()}${button(round===9?'Показать итог игры':'Следующий раунд →','next-round','primary wide')}`;
// Optional live image: Wikipedia API. Failure does not interfere with gameplay.
const img=$('#topic-photo'), info=$('#img-info');fetch('https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrlimit=1&gsrsearch='+imageSearch+'&prop=pageimages&piprop=thumbnail&pithumbsize=900&format=json&origin=*').then(r=>r.json()).then(d=>{const pg=Object.values(d.query?.pages||{})[0];if(pg?.thumbnail?.source){img.src=pg.thumbnail.source;img.onload=()=>{img.style.display='block';info.textContent='Иллюстрация: Википедия'};img.onerror=()=>{info.textContent='Иллюстрация недоступна'}}else info.textContent='Иллюстрация недоступна'}).catch(()=>{info.textContent='Иллюстрация недоступна'});
}
function finish(){stop();screen='finish';setStage('ФИНАЛ');const ranking=players.map((p,i)=>({p,score:scores[i]})).sort((a,b)=>b.score-a.score);const top=ranking[0].score;app.innerHTML=heading('🏆 Игра окончена!','Все 10 раундов позади. Вот итоговый зачёт.')+`<div class="card center"><div style="font-size:52px">🏆</div><h2>${escapeHtml(ranking.filter(r=>r.score===top).map(r=>r.p).join(' и '))}</h2><p class="hint">${top} очков — лучший результат</p></div><div class="card">${ranking.map((r,i)=>`<div class="rule">${i+1}. <b>${escapeHtml(r.p)}</b> — ${r.score} очков</div>`).join('')}</div>${button('Сыграть ещё','reset')}`}
const sideMenu=$('#side-menu'),overlay=$('#menu-overlay'),openMenuBtn=$('#open-menu');
function toggleMenu(open){document.body.classList.toggle('menu-open',open);openMenuBtn.setAttribute('aria-expanded',String(open));sideMenu.setAttribute('aria-hidden',String(!open));if(open)$('#close-menu').focus();else openMenuBtn.focus()}
function goHome(){if(['ready','question','result'].includes(screen)&&!confirm('Вернуться на главную? Текущая игра начнётся заново.'))return false;stop();players=[''];home();window.scrollTo(0,0);return true}
function openQuiz(){if(['ready','question','result'].includes(screen)&&!confirm('Открыть настройки викторины? Текущая игра начнётся заново.'))return false;stop();players=[''];quizSetup();window.scrollTo(0,0);return true}
function rulesPage(){if(['ready','question','result'].includes(screen)&&!confirm('Открыть правила? Текущая игра начнётся заново.'))return;stop();screen='rules';setStage('ПРАВИЛА');highlightMenu('quiz');app.innerHTML=heading('Правила викторины','')+`<div class="card"><h2>Как играть</h2><ol class="info-list"><li>Введите от одного до десяти имён и начните игру.</li><li>Игра состоит из десяти раундов. В каждом — четыре варианта ответа.</li><li>На ответ даётся 30 секунд. Верный ответ приносит 10 очков.</li><li>В чётных раундах можно выбрать «РИСК»: правильный ответ удваивает очки и добавляет 10, ошибка обнуляет счёт.</li><li>После раунда показываются ответы, а в конце — общий результат.</li></ol>${button('К настройке викторины','quiz-setup')}</div>`;window.scrollTo(0,0)}
openMenuBtn.addEventListener('click',()=>toggleMenu(true));$('#close-menu').addEventListener('click',()=>toggleMenu(false));overlay.addEventListener('click',()=>toggleMenu(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('menu-open'))toggleMenu(false)});
sideMenu.addEventListener('click',e=>{const btn=e.target.closest('[data-menu]');if(!btn)return;const a=btn.dataset.menu;toggleMenu(false);if(a==='home')goHome();if(a==='quiz')openQuiz()});
document.querySelector('#home-link').addEventListener('click',e=>{e.preventDefault();goHome()});app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(a==='open-quiz')openQuiz();if(a==='quiz-setup')quizSetup();if(a==='rules')rulesPage();if(a==='add-player')addPlayer();if(a==='start')init();if(a==='reset')quizSetup();if(a==='no-risk'){risks[current()]=false;const el=$('#risk-choice');if(el)el.textContent='Выбрано: без риска'}if(a==='take-risk'){risks[current()]=true;const el=$('#risk-choice');if(el)el.textContent='Выбрано: ⚡ РИСК'}if(a==='answer-ready'&&screen==='ready')showQuestion();if(a==='answer'&&screen==='question')submit(Number(b.dataset.choice));if(a==='next-round'&&screen==='result'){round++;if(round===10)finish();else startRound()}});
window.addEventListener('pagehide',stop);home();
})();
</script></body></html>
